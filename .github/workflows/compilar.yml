name: Compilar IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  compilar:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        run: xcodegen generate

      - name: Compilar sin firmar
        run: |
          set -o pipefail
          xcodebuild \
            -project Sueno.xcodeproj \
            -scheme Sueno \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build 2>&1 | tee xcodebuild.log

      - name: Poner los permisos del grupo compartido y empaquetar el .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/Sueno.app"
          codesign --force --sign - --entitlements Config/SuenoWidget.entitlements "$APP/PlugIns/SuenoWidget.appex"
          codesign --force --sign - --entitlements Config/Sueno.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Sueno.ipa Payload
          ls -lh Sueno.ipa

      - name: Subir el .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Sueno-ipa
          path: Sueno.ipa
          retention-days: 30

      - name: Subir el log si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-de-compilacion
          path: xcodebuild.log
          if-no-files-found: ignore

# Proyecto de Xcode descrito en texto. GitHub Actions lo convierte en Sueno.xcodeproj con XcodeGen.
name: Sueno
options:
  bundleIdPrefix: com.eduardo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Sueno:
    type: application
    platform: iOS
    sources:
      - path: Sueno
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Sueno
        PRODUCT_BUNDLE_IDENTIFIER: com.eduardo.sueno
        INFOPLIST_FILE: Config/Sueno-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Sueno.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: SuenoWidget
        embed: true
    scheme: {}

  SuenoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SuenoWidget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SuenoWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.eduardo.sueno.widget
        INFOPLIST_FILE: Config/SuenoWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SuenoWidget.entitlements
        SKIP_INSTALL: YES
